# =============================================================================
# CommitEd GitLab CI/CD Pipeline (Simplified)
# =============================================================================
# A streamlined pipeline focused on building and deploying.
# Tests are optional until the team writes actual test cases.
# 
# Pipeline Stages:
# 1. test     - Run unit tests (optional, won't block builds)
# 2. build    - Build Docker images
# 3. deploy   - Deploy to staging/production (manual trigger)
# =============================================================================

stages:
  - test
  - build
  - deploy

# Global variables
variables:
  DOCKER_REGISTRY: $CI_REGISTRY
  DOCKER_IMAGE_PREFIX: $CI_REGISTRY_IMAGE
  DOCKER_HOST: tcp://docker:2376
  DOCKER_TLS_CERTDIR: "/certs"
  DOCKER_TLS_VERIFY: 1
  DOCKER_CERT_PATH: "$DOCKER_TLS_CERTDIR/client"

# =============================================================================
# TEST STAGE - Optional tests (won't block builds)
# =============================================================================
# These jobs are set to allow_failure: true so they won't block your builds.
# As you add real tests, you can remove allow_failure to make them required.

test:gateway:
  stage: test
  image: maven:3.9-eclipse-temurin-17
  script:
    - cd services/gateway
    - mvn test -B
  allow_failure: true
  only:
    changes:
      - services/gateway/**/*

test:core:
  stage: test
  image: php:8.2-cli
  before_script:
    - apt-get update && apt-get install -y git unzip libzip-dev
    - docker-php-ext-install zip
    - curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
  script:
    - cd services/core
    - composer install --no-interaction --prefer-dist
    - php bin/phpunit || echo "No tests yet"
  allow_failure: true
  only:
    changes:
      - services/core/**/*

test:code-analyzer:
  stage: test
  image: python:3.11-slim
  script:
    - cd services/code-analyzer
    - pip install -r requirements.txt
    - pip install pytest
    - pytest tests/ -v || echo "No tests yet"
  allow_failure: true
  only:
    changes:
      - services/code-analyzer/**/*

test:notifications:
  stage: test
  image: mcr.microsoft.com/dotnet/sdk:8.0
  script:
    - cd services/notifications
    - dotnet test || echo "No tests yet"
  allow_failure: true
  only:
    changes:
      - services/notifications/**/*

test:web:
  stage: test
  image: node:20-alpine
  script:
    - cd web
    - npm ci
    - npm run test -- --run || echo "No tests yet"
  allow_failure: true
  only:
    changes:
      - web/**/*

# =============================================================================
# BUILD STAGE - Build Docker images
# =============================================================================

.build_template: &build_template
  stage: build
  image: docker:24
  services:
    - docker:24-dind
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  after_script:
    - docker logout $CI_REGISTRY || true

build:gateway:
  <<: *build_template
  script:
    - cd services/gateway
    - docker build -t $DOCKER_IMAGE_PREFIX/gateway:$CI_COMMIT_SHA -t $DOCKER_IMAGE_PREFIX/gateway:latest .
    - docker push $DOCKER_IMAGE_PREFIX/gateway:$CI_COMMIT_SHA
    - docker push $DOCKER_IMAGE_PREFIX/gateway:latest
  only:
    changes:
      - services/gateway/**/*

build:core:
  <<: *build_template
  script:
    - cd services/core
    - docker build -t $DOCKER_IMAGE_PREFIX/core:$CI_COMMIT_SHA -t $DOCKER_IMAGE_PREFIX/core:latest .
    - docker push $DOCKER_IMAGE_PREFIX/core:$CI_COMMIT_SHA
    - docker push $DOCKER_IMAGE_PREFIX/core:latest
  only:
    changes:
      - services/core/**/*

build:code-analyzer:
  <<: *build_template
  script:
    - cd services/code-analyzer
    - docker build -t $DOCKER_IMAGE_PREFIX/code-analyzer:$CI_COMMIT_SHA -t $DOCKER_IMAGE_PREFIX/code-analyzer:latest .
    - docker push $DOCKER_IMAGE_PREFIX/code-analyzer:$CI_COMMIT_SHA
    - docker push $DOCKER_IMAGE_PREFIX/code-analyzer:latest
  only:
    changes:
      - services/code-analyzer/**/*

build:notifications:
  <<: *build_template
  script:
    - cd services/notifications
    - docker build -t $DOCKER_IMAGE_PREFIX/notifications:$CI_COMMIT_SHA -t $DOCKER_IMAGE_PREFIX/notifications:latest .
    - docker push $DOCKER_IMAGE_PREFIX/notifications:$CI_COMMIT_SHA
    - docker push $DOCKER_IMAGE_PREFIX/notifications:latest
  only:
    changes:
      - services/notifications/**/*

build:web:
  <<: *build_template
  script:
    - cd web
    - docker build -t $DOCKER_IMAGE_PREFIX/web:$CI_COMMIT_SHA -t $DOCKER_IMAGE_PREFIX/web:latest .
    - docker push $DOCKER_IMAGE_PREFIX/web:$CI_COMMIT_SHA
    - docker push $DOCKER_IMAGE_PREFIX/web:latest
  only:
    changes:
      - web/**/*

# Manual full rebuild of all services
build:all:
  <<: *build_template
  script:
    - |
      for service in gateway core code-analyzer notifications; do
        cd services/$service
        docker build -t $DOCKER_IMAGE_PREFIX/$service:$CI_COMMIT_SHA -t $DOCKER_IMAGE_PREFIX/$service:latest .
        docker push $DOCKER_IMAGE_PREFIX/$service:$CI_COMMIT_SHA
        docker push $DOCKER_IMAGE_PREFIX/$service:latest
        cd $CI_PROJECT_DIR
      done
    - cd web
    - docker build -t $DOCKER_IMAGE_PREFIX/web:$CI_COMMIT_SHA -t $DOCKER_IMAGE_PREFIX/web:latest .
    - docker push $DOCKER_IMAGE_PREFIX/web:$CI_COMMIT_SHA
    - docker push $DOCKER_IMAGE_PREFIX/web:latest
  when: manual

# =============================================================================
# DEPLOY STAGE - Manual deployment
# =============================================================================

deploy:staging:
  stage: deploy
  image: docker:24
  services:
    - docker:24-dind
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - echo "Deploying to staging..."
    - echo "Configure your deployment commands here"
  environment:
    name: staging
    url: https://staging.commit-ed.example.com
  when: manual
  only:
    - develop

deploy:production:
  stage: deploy
  image: docker:24
  services:
    - docker:24-dind
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - echo "Deploying to production..."
    - echo "Configure your deployment commands here"
  environment:
    name: production
    url: https://commit-ed.example.com
  when: manual
  only:
    - main
    - master
