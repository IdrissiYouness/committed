services:
    # PostgreSQL Database (shared by all services)
    postgres-db:
        image: postgres:16-alpine
        container_name: committed-postgres
        environment:
            - POSTGRES_DB=${POSTGRES_DB}
            - POSTGRES_USER=${POSTGRES_USER}
            - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
        ports:
            - "${POSTGRES_PORT:-5432}:5432"
        volumes:
            - postgres-data:/var/lib/postgresql/data
            - ./db/init.sql:/docker-entrypoint-initdb.d/00_init.sql:ro
            - ./db/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
            - ./db/02_seed_data.sql:/docker-entrypoint-initdb.d/02_seed_data.sql:ro
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}",
                ]
            interval: 10s
            timeout: 5s
            retries: 5
        networks:
            - committed-network

    # Gateway Service (Java Spring Boot)
    gateway:
        build:
            context: ../services/gateway
            dockerfile: Dockerfile
        container_name: committed-gateway
        ports:
            - "${GATEWAY_PORT}:8080"
        environment:
            - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-db:5432/${POSTGRES_DB}
            - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER}
            - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD}
            - SPRING_DATASOURCE_DRIVER_CLASS_NAME=org.postgresql.Driver
            - SPRING_JPA_DATABASE_PLATFORM=org.hibernate.dialect.PostgreSQLDialect
            - JWT_SECRET=${JWT_SECRET}
            - JWT_EXPIRATION=${JWT_EXPIRATION}
            - CORE_SERVICE_URL=http://core:8000
            - ANALYZER_SERVICE_URL=http://code-analyzer:5000
            - NOTIFICATION_SERVICE_URL=http://notifications:5001
        depends_on:
            postgres-db:
                condition: service_healthy
        networks:
            - committed-network
        restart: unless-stopped

    # Core Service (PHP Symfony)
    core:
        build:
            context: ../services/core
            dockerfile: Dockerfile
        container_name: committed-core
        ports:
            - "${CORE_PORT}:8000"
        environment:
            - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres-db:5432/${POSTGRES_DB}?serverVersion=16&charset=utf8
            - APP_ENV=${APP_ENV}
            - APP_SECRET=${APP_SECRET}
            - CORS_ALLOW_ORIGIN='^https?://(localhost|127\.0\.0\.1)(:[0-9]+)?$$'
            - DEFAULT_URI=http://localhost:${CORE_PORT:-8000}
            - GATEWAY_SERVICE_URL=http://gateway:8080
            - ANALYZER_SERVICE_URL=http://code-analyzer:5000
            - NOTIFICATION_SERVICE_URL=http://notifications:5001
        depends_on:
            postgres-db:
                condition: service_healthy
        networks:
            - committed-network
        restart: unless-stopped

    # Code Analyzer Service (Python Flask)
    # Note: This service does NOT connect to database directly.
    # Gateway sends all necessary data via HTTP requests.
    code-analyzer:
        build:
            context: ../services/code-analyzer
            dockerfile: Dockerfile
        container_name: committed-analyzer
        ports:
            - "${ANALYZER_PORT}:5000"
        environment:
            - OPENAI_API_KEY=${OPENAI_API_KEY}
            - TEMP_CLONE_DIR=${TEMP_CLONE_DIR}
            - NOTIFICATION_SERVICE_URL=http://notifications:5001
            - GATEWAY_SERVICE_URL=http://gateway:8080
        volumes:
            - analyzer-temp:/tmp/code-analysis
        networks:
            - committed-network
        restart: unless-stopped

    # Notification Service (.NET Core)
    notifications:
        build:
            context: ../services/notifications
            dockerfile: Dockerfile
        container_name: committed-notifications
        ports:
            - "${NOTIFICATION_PORT}:5001"
        environment:
            - ConnectionStrings__DefaultConnection=Host=postgres-db;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
            - SmtpSettings__Host=${SMTP_HOST}
            - SmtpSettings__Port=${SMTP_PORT}
            - SmtpSettings__Username=${SMTP_USER}
            - SmtpSettings__Password=${SMTP_PASSWORD}
            - SmtpSettings__FromEmail=${FROM_EMAIL}
            - SmtpSettings__FromName=${FROM_NAME}
        depends_on:
            postgres-db:
                condition: service_healthy
        networks:
            - committed-network
        restart: unless-stopped

    # Web Frontend (React)
    web:
        build:
            context: ../web
            dockerfile: Dockerfile
        container_name: committed-web
        ports:
            - "3000:80"
        environment:
            - VITE_API_URL=${VITE_API_URL}
        depends_on:
            - gateway
        networks:
            - committed-network
        restart: unless-stopped

    # Nginx Reverse Proxy
    nginx:
        image: nginx:alpine
        container_name: committed-nginx
        ports:
            - "${NGINX_PORT}:80"
        volumes:
            - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
            - ./nginx/scalar.html:/usr/share/nginx/html/docs/scalar.html:ro
            - ../docs/openapi.yaml:/usr/share/nginx/html/docs/openapi.yaml:ro
        depends_on:
            - gateway
            - web
        networks:
            - committed-network
        restart: unless-stopped

volumes:
    analyzer-temp:
    postgres-data:

networks:
    committed-network:
        driver: bridge
