services:
  # Oracle Database
  oracle-db:
    image: container-registry.oracle.com/database/express:21.3.0-xe
    container_name: committed-oracle
    environment:
      - ORACLE_PWD=${ORACLE_PASSWORD}
      - ORACLE_CHARACTERSET=AL32UTF8
    ports:
      - "${DB_PORT}:1521"
    volumes:
      - oracle-data:/opt/oracle/oradata
      - ./db/init.sql:/opt/oracle/scripts/startup/init.sql
    healthcheck:
      test: ["CMD-SHELL", "echo 'SELECT 1 FROM DUAL;' | sqlplus -s system/$$ORACLE_PWD@//localhost:1521/XEPDB1 || exit 1"]
      interval: 30s
      timeout: 30s
      retries: 10
      start_period: 180s
    networks:
      - committed-network

  # Gateway Service (Java Spring Boot)
  gateway:
    build:
      context: ../services/gateway
      dockerfile: Dockerfile
    container_name: committed-gateway
    ports:
      - "${GATEWAY_PORT}:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:oracle:thin:@oracle-db:${DB_PORT}/${DB_SERVICE}
      - SPRING_DATASOURCE_USERNAME=${DB_USER}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRATION=${JWT_EXPIRATION}
      - CORE_SERVICE_URL=http://core:8000
      - ANALYZER_SERVICE_URL=http://code-analyzer:5000
      - NOTIFICATION_SERVICE_URL=http://notifications:5001
    depends_on:
      oracle-db:
        condition: service_healthy
    networks:
      - committed-network
    restart: unless-stopped

  # Core Service (PHP Symfony)
  core:
    build:
      context: ../services/core
      dockerfile: Dockerfile
    container_name: committed-core
    ports:
      - "${CORE_PORT}:8000"
    environment:
      - DATABASE_URL=oci8://${DB_USER}:${DB_PASSWORD}@oracle-db:${DB_PORT}/${DB_SERVICE}
      - APP_ENV=${APP_ENV}
      - APP_SECRET=${APP_SECRET}
      - GATEWAY_SERVICE_URL=http://gateway:8080
      - ANALYZER_SERVICE_URL=http://code-analyzer:5000
      - NOTIFICATION_SERVICE_URL=http://notifications:5001
    depends_on:
      oracle-db:
        condition: service_healthy
    networks:
      - committed-network
    restart: unless-stopped

  # Code Analyzer Service (Python Flask)
  # Note: This service does NOT connect to database directly.
  # Gateway sends all necessary data via HTTP requests.
  code-analyzer:
    build:
      context: ../services/code-analyzer
      dockerfile: Dockerfile
    container_name: committed-analyzer
    ports:
      - "${ANALYZER_PORT}:5000"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - TEMP_CLONE_DIR=${TEMP_CLONE_DIR}
      - NOTIFICATION_SERVICE_URL=http://notifications:5001
      - GATEWAY_SERVICE_URL=http://gateway:8080
    volumes:
      - analyzer-temp:/tmp/code-analysis
    networks:
      - committed-network
    restart: unless-stopped

  # Notification Service (.NET Core)
  notifications:
    build:
      context: ../services/notifications
      dockerfile: Dockerfile
    container_name: committed-notifications
    ports:
      - "${NOTIFICATION_PORT}:5001"
    environment:
      - ConnectionStrings__OracleDb=User Id=${DB_USER};Password=${DB_PASSWORD};Data Source=oracle-db:${DB_PORT}/${DB_SERVICE}
      - SmtpSettings__Host=${SMTP_HOST}
      - SmtpSettings__Port=${SMTP_PORT}
      - SmtpSettings__Username=${SMTP_USER}
      - SmtpSettings__Password=${SMTP_PASSWORD}
      - SmtpSettings__FromEmail=${FROM_EMAIL}
      - SmtpSettings__FromName=${FROM_NAME}
    depends_on:
      oracle-db:
        condition: service_healthy
    networks:
      - committed-network
    restart: unless-stopped

  # Web Frontend (React)
  web:
    build:
      context: ../web
      dockerfile: Dockerfile
    container_name: committed-web
    ports:
      - "3000:80"
    environment:
      - VITE_API_URL=${VITE_API_URL}
    depends_on:
      - gateway
    networks:
      - committed-network
    restart: unless-stopped

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: committed-nginx
    ports:
      - "${NGINX_PORT}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - gateway
      - web
    networks:
      - committed-network
    restart: unless-stopped

volumes:
  oracle-data:
  analyzer-temp:

networks:
  committed-network:
    driver: bridge
