  /internal/core/api/submissions/{submissionId}/trigger-analysis:
    post:
      tags: [Internal - Core]
      summary: "[Internal] Core triggers analysis on Code Analyzer"
      description: |
        **Called by:** Core (on submission creation or manual trigger)
        **Core calls:** `POST http://code-analyzer:5000/analyze`

        The Core service reads the submission from the database, then sends the
        `submissionId`, `repoUrl`, and `studentId` to the Code Analyzer.
      operationId: internal_core_triggerAnalysis
      security: []
      parameters:
        - $ref: "#/components/parameters/SubmissionId"
      responses:
        "202":
          description: Analysis request forwarded to Code Analyzer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse_AnalysisTriggerResponse"

  # =========================================================================
  # INTERNAL: CODE ANALYZER ENDPOINTS (called by Core on port 5000)
  # =========================================================================

  /internal/analyzer/analyze:
    post:
      tags: [Internal - Code Analyzer]
      summary: "[Internal] Analyze a code submission"
      description: |
        **Called by:** Core service
        **URL:** `POST http://code-analyzer:5000/analyze`

        Performs the full analysis pipeline:
        1. Clone GitHub repository
        2. Run code metrics analysis (Kilo Code CLI)
        3. Classify code quality (excellent/good/average/poor)
        4. Generate AI feedback via OpenAI
        5. Generate PDF report
        6. Send notification via Notifications service
        7. Update `code_analysis` table in database

        This endpoint may take several minutes to complete.
      operationId: internal_analyzer_analyze
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnalyzeRequest"
            example:
              submissionId: 1
              repoUrl: "https://github.com/student/assignment-repo"
              studentId: 5
      responses:
        "200":
          description: Analysis completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyzeResponse"
              example:
                status: success
                data:
                  submissionId: 1
                  status: completed
                  metrics:
                    complexity: 45
                    maintainability: 72
                    test_coverage: 60
                    code_smells: 5
                    documentation: 40
                  classification:
                    score: 65.5
                    category: good
                    metrics:
                      complexity: 45
                      maintainability: 72
                      test_coverage: 60
                      code_smells: 5
                      documentation: 40
                    timestamp: "2026-02-03T13:05:00.000Z"
                  feedback:
                    category: good
                    feedback: "Your code demonstrates solid fundamentals..."
                    score: 65.5
                    timestamp: "2026-02-03T13:05:00.000Z"
                  reportUrl: "/reports/analysis_report_1_20260203_130500.pdf"
                  analyzedAt: "2026-02-03T13:05:00.000Z"
                timestamp: "2026-02-03T13:05:00.000Z"
        "400":
          description: Missing required fields
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyzerErrorResponse"
              example:
                status: error
                message: "Missing required fields: submissionId, repoUrl"
                timestamp: "2026-02-03T13:00:00.000Z"
        "500":
          description: Analysis failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyzerErrorResponse"

  /internal/analyzer/status/{submissionId}:
    get:
      tags: [Internal - Code Analyzer]
      summary: "[Internal] Get analysis status"
      description: |
        **Called by:** Core service or Gateway
        **URL:** `GET http://code-analyzer:5000/status/{submissionId}`
      operationId: internal_analyzer_getStatus
      security: []
      parameters:
        - $ref: "#/components/parameters/SubmissionId"
      responses:
        "200":
          description: Analysis status retrieved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalysisStatusResponse"
              example:
                submissionId: 1
                status: completed
                timestamp: "2026-02-03T13:05:00.000Z"

  /internal/analyzer/health:
    get:
      tags: [Internal - Code Analyzer]
      summary: "[Internal] Code Analyzer health check"
      description: |
        **URL:** `GET http://code-analyzer:5000/health`
      operationId: internal_analyzer_health
      security: []
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              example:
                status: UP
                service: code-analyzer
                timestamp: "2026-02-03T13:00:00.000Z"

  # =========================================================================
  # INTERNAL: NOTIFICATIONS ENDPOINTS (called by Code Analyzer / Core)
  # =========================================================================

  /internal/notifications/api/notifications:
    post:
      tags: [Internal - Notifications]
      summary: "[Internal] Send a notification"
      description: |
        **Called by:** Code Analyzer or Core service
        **URL:** `POST http://notifications:5001/api/notifications`

        Creates an in-app notification record and optionally sends an email.
      operationId: internal_notifications_send
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendNotificationRequest"
            example:
              userId: 5
              type: SUBMISSION_ANALYZED
              subject: "Your code has been analyzed"
              message: "Analysis complete for submission #1. Quality score: 65.5/100 (Good)"
              userEmail: "student@committed.com"
              sendEmail: true
      responses:
        "200":
          description: Notification sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationOperationResponse"
              example:
                success: true
                message: Notification sent successfully
                notificationId: 42
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationOperationResponse"
              example:
                success: false
                message: "User ID is required"
                notificationId: null

  /internal/notifications/api/notifications/user/{userId}:
    get:
