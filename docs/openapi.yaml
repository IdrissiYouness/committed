    # -----------------------------------------------------------------------

    AnalyzeRequest:
      type: object
      description: Request sent by Core to Code Analyzer (internal)
      properties:
        submissionId:
          type: integer
          format: int64
          example: 1
        repoUrl:
          type: string
          example: "https://github.com/student/lab2-linked-lists"
        studentId:
          type: integer
          format: int64
          example: 5
      required: [submissionId, repoUrl]

    AnalyzeResponse:
      type: object
      description: Response from Code Analyzer (internal)
      properties:
        status:
          type: string
          enum: [success, error]
        data:
          type: object
          properties:
            submissionId:
              type: integer
              format: int64
            status:
              type: string
              enum: [completed, failed]
            metrics:
              $ref: "#/components/schemas/CodeMetrics"
            classification:
              $ref: "#/components/schemas/CodeClassification"
            feedback:
              $ref: "#/components/schemas/AIFeedback"
            reportUrl:
              type: string
              example: "/reports/analysis_report_1_20260203_130500.pdf"
            analyzedAt:
              type: string
              format: date-time
        timestamp:
          type: string
          format: date-time

    AnalyzerErrorResponse:
      type: object
      properties:
        status:
          type: string
          enum: [error]
        message:
          type: string
        timestamp:
          type: string
          format: date-time
      required: [status, message, timestamp]

    AnalysisStatusResponse:
      type: object
      properties:
        submissionId:
          type: integer
          format: int64
        status:
          type: string
          enum: [pending, analyzing, completed, failed]
        timestamp:
          type: string
          format: date-time
      required: [submissionId, status, timestamp]

    CodeMetrics:
      type: object
      description: Code quality metrics from static analysis
      properties:
        complexity:
          type: number
          description: Cyclomatic complexity score (0-100)
          example: 45
        maintainability:
          type: number
          description: Maintainability index (0-100)
          example: 72
        test_coverage:
          type: number
          description: Test coverage percentage (0-100)
          example: 60
        code_smells:
          type: integer
          description: Number of code smells detected
          example: 5
        documentation:
          type: number
          description: Documentation coverage (0-100)
          example: 40

    CodeClassification:
      type: object
      description: Quality classification based on metrics
      properties:
        score:
          type: number
          format: float
          description: Overall quality score (0-100)
          example: 65.5
        category:
          type: string
          enum: [excellent, good, average, poor]
          example: "good"
        metrics:
          $ref: "#/components/schemas/CodeMetrics"
        timestamp:
          type: string
          format: date-time
      required: [score, category, timestamp]

    AIFeedback:
      type: object
      description: AI-generated feedback from OpenAI
      properties:
        category:
          type: string
          enum: [excellent, good, average, poor]
          example: "good"
        feedback:
          type: string
          description: AI-generated feedback text (HTML or plain text)
          example: "Your code demonstrates solid fundamentals. Here are some suggestions..."
        score:
          type: number
          format: float
          example: 65.5
        timestamp:
          type: string
          format: date-time
      required: [category, feedback, score, timestamp]

    AnalysisResultSummary:
      type: object
      description: Analysis result summary included in submission detail responses
      properties:
        analysisId:
          type: integer
          format: int64
          example: 42
        status:
          type: string
          enum: [pending, analyzing, completed, failed]
          example: "completed"
        score:
          type: number
          format: float
          nullable: true
          example: 65.5
        category:
          type: string
          enum: [excellent, good, average, poor]
          nullable: true
          example: "good"
        reportPdfUrl:
          type: string
          nullable: true
          example: "/reports/analysis_report_1_20260203_130500.pdf"
        errorMessage:
          type: string
          nullable: true
        analyzedAt:
          type: string
          format: date-time
          nullable: true

    AnalysisResultResponse:
      type: object
      description: Full analysis results
      properties:
        analysisId:
          type: integer
          format: int64
          example: 42
        submissionId:
          type: integer
          format: int64
          example: 1
        status:
          type: string
          enum: [pending, analyzing, completed, failed]
        metrics:
          $ref: "#/components/schemas/CodeMetrics"
          nullable: true
        classification:
          $ref: "#/components/schemas/CodeClassification"
          nullable: true
        feedback:
          $ref: "#/components/schemas/AIFeedback"
          nullable: true
        reportPdfUrl:
          type: string
          nullable: true
        errorMessage:
          type: string
          nullable: true
        analyzedAt:
          type: string
          format: date-time
          nullable: true

