        htmlBody:
          type: string
          example: "<h1>Welcome!</h1><p>You have been enrolled in CS101.</p>"
        textBody:
          type: string
          nullable: true
          example: "Welcome! You have been enrolled in CS101."
      required: [toEmail, subject, htmlBody]

    NotificationOperationResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: "Notification sent successfully"
        notificationId:
          type: integer
          format: int64
          nullable: true
          example: 42
      required: [success, message]

# ===========================================================================
# DEFAULT SECURITY (applied to all endpoints unless overridden)
# ===========================================================================
security:
  - BearerAuth: []
