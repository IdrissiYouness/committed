# ===========================================================================
# COMPONENTS
# ===========================================================================
components:

  # =========================================================================
  # SECURITY SCHEMES
  # =========================================================================
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT access token obtained from `/api/auth/login` or `/api/auth/register`.
        Include in the `Authorization` header as `Bearer <token>`.

  # =========================================================================
  # PARAMETERS
  # =========================================================================
  parameters:
    UserId:
      name: userId
      in: path
      required: true
      description: User ID
      schema:
        type: integer
        format: int64
        example: 1

    CourseId:
      name: courseId
      in: path
      required: true
      description: Course ID
      schema:
        type: integer
        format: int64
        example: 1

    AssignmentId:
      name: assignmentId
      in: path
      required: true
      description: Assignment ID
      schema:
        type: integer
        format: int64
        example: 1

    SubmissionId:
      name: submissionId
      in: path
      required: true
      description: Submission ID
      schema:
        type: integer
        format: int64
        example: 1

    AnnouncementId:
      name: announcementId
      in: path
      required: true
      description: Announcement ID
      schema:
        type: integer
        format: int64
        example: 1

    NotificationId:
      name: notificationId
      in: path
      required: true
      description: Notification ID
      schema:
        type: integer
        format: int64
        example: 1

    PageParam:
      name: page
      in: query
      description: Page number (1-based)
      schema:
        type: integer
        minimum: 1
        default: 1

    LimitParam:
      name: limit
      in: query
      description: Number of items per page
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

  # =========================================================================
  # RESPONSE TEMPLATES
  # =========================================================================
  responses:
    Unauthorized:
      description: Authentication required or invalid token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            success: false
            error: Unauthorized
            message: Invalid or missing authentication token
            timestamp: "2026-02-03T13:00:00Z"

    Forbidden:
      description: Insufficient permissions
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            success: false
            error: Forbidden
            message: You do not have permission to perform this action
            timestamp: "2026-02-03T13:00:00Z"

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            success: false
            error: Not Found
            message: Resource not found
            timestamp: "2026-02-03T13:00:00Z"

    ValidationError:
      description: Validation error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ValidationErrorResponse"
          example:
            success: false
            error: Validation Error
            message: Invalid input data
            details:
              email: Email is required
              password: Password must be at least 8 characters
            timestamp: "2026-02-03T13:00:00Z"

  # =========================================================================
  # SCHEMAS
  # =========================================================================
  schemas:

    # -----------------------------------------------------------------------
    # Generic Response Wrappers
    # -----------------------------------------------------------------------

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: string
          example: "Not Found"
        message:
          type: string
          example: "Resource not found"
        timestamp:
          type: string
          format: date-time
      required: [success, message, timestamp]

    ValidationErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: string
          example: "Validation Error"
        message:
          type: string
          example: "Invalid input data"
        details:
          type: object
          additionalProperties:
            type: string
          example:
            email: "Email is required"
            password: "Password must be at least 8 characters"
        timestamp:
          type: string
          format: date-time
      required: [success, message, timestamp]

    ApiResponse_Null:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          nullable: true
          example: null
        message:
          type: string
        timestamp:
          type: string
          format: date-time
      required: [success, message, timestamp]

    PaginationMeta:
      type: object
      properties:
        page:
          type: integer
          example: 1
        limit:
          type: integer
          example: 20
        total:
          type: integer
          example: 45
        pages:
          type: integer
          example: 3
      required: [page, limit, total, pages]

    # -----------------------------------------------------------------------
    # Health
    # -----------------------------------------------------------------------

    HealthResponse:
      type: object
      properties:
        status:
          type: string
          enum: [UP, DOWN]
          example: UP
        service:
          type: string
          example: gateway
        timestamp:
          type: string
          format: date-time
      required: [status, service, timestamp]

    ChainTestResponse:
      type: object
      properties:
        status:
          type: string
          enum: [success, partial, error]
        message:
          type: string
        chain:
          type: object
          properties:
            gateway:
              type: string
              enum: [connected, disconnected]
            core:
              type: string
              enum: [connected, disconnected]
            database:
              type: string
              enum: [connected, disconnected, unknown]
        timestamp:
          type: string
          format: date-time
      required: [status, message, chain, timestamp]

    # -----------------------------------------------------------------------
    # Authentication
    # -----------------------------------------------------------------------

    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          example: "student@committed.com"
        password:
          type: string
          format: password
          minLength: 8
          example: "password123"
      required: [email, password]

    RegisterRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          example: "newstudent@committed.com"
        fullName:
          type: string
          minLength: 1
          maxLength: 255
          example: "Jane Doe"
        password:
          type: string
          format: password
          minLength: 8
          example: "securepass123"
      required: [email, fullName, password]

    RefreshTokenRequest:
      type: object
      properties:
        refreshToken:
          type: string
          example: "eyJhbGciOiJIUzI1NiJ9..."
      required: [refreshToken]

    AuthResponse:
      type: object
      properties:
        accessToken:
          type: string
          description: JWT access token (short-lived, default 24h)
        refreshToken:
          type: string
          description: JWT refresh token (long-lived, default 7d)
        user:
          $ref: "#/components/schemas/UserResponse"
      required: [accessToken, refreshToken, user]

    ApiResponse_AuthResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: "#/components/schemas/AuthResponse"
        message:
          type: string
          example: "Login successful"
        timestamp:
          type: string
          format: date-time
      required: [success, data, message, timestamp]

    # -----------------------------------------------------------------------
    # Users
    # -----------------------------------------------------------------------

    UserResponse:
      type: object
      properties:
        userId:
          type: integer
          format: int64
          example: 1
        email:
          type: string
          format: email
          example: "student@committed.com"
        fullName:
          type: string
          example: "Jane Doe"
        systemRole:
          type: string
          enum: [user, admin]
          example: "user"
        isActive:
          type: boolean
          example: true
        createdAt:
