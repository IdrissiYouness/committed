  /internal/notifications/api/notifications/{notificationId}:
    get:
      tags: [Internal - Notifications]
      summary: "[Internal] Get notification by ID"
      description: |
        **Called by:** Gateway
        **URL:** `GET http://notifications:5001/api/notifications/{notificationId}`
      operationId: internal_notifications_getById
      security: []
      parameters:
        - $ref: "#/components/parameters/NotificationId"
      responses:
        "200":
          description: Notification retrieved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /internal/notifications/api/notifications/{notificationId}/read:
    put:
      tags: [Internal - Notifications]
      summary: "[Internal] Mark notification as read"
