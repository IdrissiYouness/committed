openapi: 3.0.3
info:
  title: Committed - Code Submission & Analysis Platform API
  description: |
    Complete API specification for the Committed educational platform.

    ## Architecture Overview
    All client requests flow through **Nginx** (port 80) which routes `/api/*` to the **Gateway** service.
    The Gateway authenticates requests via JWT and proxies them to backend services.

    ## Service Communication Map
    ```
    Client → Nginx → Gateway → Core (courses, assignments, submissions, users)
                             → Code Analyzer (code analysis, grading)
                             → Notifications (email, in-app notifications)
                      Core → Code Analyzer (trigger analysis)
              Code Analyzer → Notifications (analysis complete alerts)
    ```

    ## Authentication
    All endpoints (except `/api/auth/*` and `/api/health`) require a valid JWT Bearer token
    obtained from the login or register endpoints.
  version: 1.0.0
  contact:
    name: Committed Team
  license:
    name: MIT

servers:
  - url: http://localhost/api
    description: Development (via Nginx reverse proxy)
  - url: http://localhost:8080
    description: Gateway direct access
  - url: http://localhost:8000
    description: Core service direct access
  - url: http://localhost:5000
    description: Code Analyzer direct access
  - url: http://localhost:5001
    description: Notifications direct access

tags:
  - name: Health
    description: Health check and connectivity test endpoints
  - name: Authentication
    description: User authentication (Gateway service)
  - name: Users
    description: User management (Gateway → Core)
  - name: Courses
    description: Course management (Gateway → Core)
  - name: Enrollments
    description: Course enrollment (Gateway → Core)
  - name: Assignments
    description: Assignment management (Gateway → Core)
  - name: Submissions
    description: Code submission management (Gateway → Core)
  - name: Grades
    description: Grading and feedback (Gateway → Core)
  - name: Announcements
    description: Course announcements and comments (Gateway → Core)
  - name: Analysis
    description: Code analysis (Gateway/Core → Code Analyzer)
  - name: Notifications
    description: Notification management (Gateway → Notifications)
  - name: Internal - Core
    description: "Internal Core service endpoints (called by Gateway, not exposed publicly)"
  - name: Internal - Code Analyzer
    description: "Internal Code Analyzer endpoints (called by Gateway or Core)"
  - name: Internal - Notifications
    description: "Internal Notification endpoints (called by Code Analyzer or Core)"

# ===========================================================================
# PATH DEFINITIONS
# ===========================================================================
paths:

  # =========================================================================
  # HEALTH ENDPOINTS
  # =========================================================================

  /health:
    get:
      tags: [Health]
      summary: Gateway health check
      operationId: getGatewayHealth
      security: []
      responses:
        "200":
          description: Gateway is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              example:
                status: UP
                service: gateway
                timestamp: "2026-02-03T13:00:00.000Z"

  /test-chain:
    get:
      tags: [Health]
      summary: Test end-to-end service chain connectivity
      description: "Tests: Gateway → Core → Database connectivity"
      operationId: testChain
      security: []
      responses:
        "200":
          description: Chain test results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChainTestResponse"
              examples:
                success:
                  summary: All services connected
                  value:
                    status: success
                    message: End-to-end chain test successful
                    chain:
                      gateway: connected
                      core: connected
                      database: connected
                    timestamp: "2026-02-03T13:00:00.000Z"
                partial:
                  summary: Partial connectivity
                  value:
                    status: partial
                    message: Core connected but database check failed
                    chain:
                      gateway: connected
                      core: connected
                      database: disconnected
                    timestamp: "2026-02-03T13:00:00.000Z"
                error:
                  summary: Service unreachable
                  value:
                    status: error
                    message: "Failed to connect to Core service: Connection refused"
                    chain:
                      gateway: connected
                      core: disconnected
                      database: unknown
                    timestamp: "2026-02-03T13:00:00.000Z"

  # =========================================================================
  # AUTHENTICATION ENDPOINTS (Gateway)
  # =========================================================================

  /auth/login:
    post:
      tags: [Authentication]
      summary: User login
      description: Authenticate a user and receive JWT access and refresh tokens.
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse_AuthResponse"
              example:
                success: true
                data:
                  accessToken: "eyJhbGciOiJIUzI1NiJ9..."
                  refreshToken: "eyJhbGciOiJIUzI1NiJ9..."
                  user:
                    userId: 1
                    email: "student@committed.com"
                    fullName: "Jane Doe"
                    systemRole: "user"
                    isActive: true
                    createdAt: "2026-02-01T10:00:00Z"
                message: Login successful
                timestamp: "2026-02-03T13:00:00Z"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "400":
          $ref: "#/components/responses/ValidationError"

  /auth/register:
    post:
      tags: [Authentication]
      summary: User registration
      description: Register a new user account.
      operationId: register
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Registration successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse_AuthResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "409":
          description: Email already registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                error: Conflict
                message: Email already registered
                timestamp: "2026-02-03T13:00:00Z"

  /auth/refresh:
    post:
      tags: [Authentication]
      summary: Refresh access token
      description: Use a valid refresh token to obtain a new access token.
      operationId: refreshToken
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshTokenRequest"
      responses:
        "200":
          description: Token refreshed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse_AuthResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  # =========================================================================
  # USER ENDPOINTS (Gateway → Core)
  # =========================================================================

  /users/me:
    get:
      tags: [Users]
      summary: Get current user profile
      description: Returns the profile of the currently authenticated user.
      operationId: getCurrentUser
      responses:
        "200":
          description: User profile retrieved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse_UserResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

    put:
      tags: [Users]
      summary: Update current user profile
      description: Update the profile of the currently authenticated user.
      operationId: updateCurrentUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserRequest"
      responses:
        "200":
          description: Profile updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse_UserResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /users/{userId}:
    get:
      tags: [Users]
      summary: Get user by ID
      description: Retrieve a user by their ID. Admin access or same user only.
      operationId: getUserById
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: User retrieved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse_UserResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  # =========================================================================
  # COURSE ENDPOINTS (Gateway → Core)
  # =========================================================================

  /courses:
    get:
      tags: [Courses]
      summary: List all courses
      description: |
        Retrieve a paginated list of active courses.
        - **Students** see courses they are enrolled in.
        - **Professors** see courses they teach.
        - **Admins** see all courses.
      operationId: listCourses
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/LimitParam"
        - name: search
          in: query
          description: Search by course name or course code
          schema:
            type: string
            example: "CS101"
      responses:
        "200":
          description: Courses retrieved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse_PaginatedCourses"
        "401":
          $ref: "#/components/responses/Unauthorized"

    post:
      tags: [Courses]
      summary: Create a new course
      description: Create a new course. The authenticated user becomes the teacher.
      operationId: createCourse
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCourseRequest"
      responses:
        "201":
          description: Course created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse_CourseResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: Course code already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /courses/{courseId}:
    get:
      tags: [Courses]
      summary: Get course by ID
      operationId: getCourseById
      parameters:
        - $ref: "#/components/parameters/CourseId"
      responses:
        "200":
          description: Course retrieved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse_CourseResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

    put:
      tags: [Courses]
      summary: Update a course
      description: Update course details. Only the course teacher or admin can update.
      operationId: updateCourse
      parameters:
        - $ref: "#/components/parameters/CourseId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCourseRequest"
      responses:
        "200":
          description: Course updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse_CourseResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

    delete:
      tags: [Courses]
      summary: Delete a course (soft delete)
      description: Soft-deletes a course by setting is_active to false. Teacher or admin only.
      operationId: deleteCourse
      parameters:
        - $ref: "#/components/parameters/CourseId"
      responses:
        "200":
          description: Course deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse_Null"
              example:
                success: true
                data: null
                message: Course deleted successfully
                timestamp: "2026-02-03T13:00:00Z"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  # =========================================================================
  # ENROLLMENT ENDPOINTS (Gateway → Core)
  # =========================================================================

  /courses/{courseId}/enroll:
    post:
      tags: [Enrollments]
      summary: Enroll in a course
      description: Enroll the authenticated user as a student in the specified course.
      operationId: enrollInCourse
      parameters:
        - $ref: "#/components/parameters/CourseId"
      responses:
        "201":
          description: Enrolled successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse_EnrollmentResponse"
              example:
                success: true
                data:
                  userId: 5
                  courseId: 1
                  courseRole: student
                  enrolledAt: "2026-02-03T13:00:00Z"
                message: Enrolled successfully
                timestamp: "2026-02-03T13:00:00Z"
        "400":
          description: Already enrolled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /courses/{courseId}/unenroll:
    delete:
      tags: [Enrollments]
      summary: Unenroll from a course
      description: Remove the authenticated user's enrollment from the course.
      operationId: unenrollFromCourse
      parameters:
        - $ref: "#/components/parameters/CourseId"
      responses:
        "200":
          description: Unenrolled successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse_Null"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /courses/{courseId}/students:
    get:
      tags: [Enrollments]
      summary: List students in a course
      description: Get all enrolled students for a course. Teacher or admin only.
      operationId: listCourseStudents
      parameters:
        - $ref: "#/components/parameters/CourseId"
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/LimitParam"
      responses:
        "200":
          description: Students retrieved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse_PaginatedEnrollments"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  # =========================================================================
  # ASSIGNMENT ENDPOINTS (Gateway → Core)
  # =========================================================================

  /courses/{courseId}/assignments:
    get:
      tags: [Assignments]
      summary: List assignments for a course
      description: Retrieve all assignments in a course. Must be enrolled or be the teacher.
      operationId: listCourseAssignments
      parameters:
        - $ref: "#/components/parameters/CourseId"
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/LimitParam"
      responses:
        "200":
          description: Assignments retrieved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse_PaginatedAssignments"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

    post:
      tags: [Assignments]
      summary: Create an assignment
      description: Create a new assignment in a course. Teacher only.
      operationId: createAssignment
      parameters:
        - $ref: "#/components/parameters/CourseId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAssignmentRequest"
      responses:
        "201":
          description: Assignment created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse_AssignmentResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /assignments/{assignmentId}:
    get:
      tags: [Assignments]
      summary: Get assignment by ID
      operationId: getAssignmentById
      parameters:
        - $ref: "#/components/parameters/AssignmentId"
      responses:
        "200":
          description: Assignment retrieved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse_AssignmentResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

    put:
      tags: [Assignments]
      summary: Update an assignment
      description: Update an assignment. Teacher only.
      operationId: updateAssignment
      parameters:
        - $ref: "#/components/parameters/AssignmentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAssignmentRequest"
      responses:
        "200":
          description: Assignment updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse_AssignmentResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

    delete:
      tags: [Assignments]
      summary: Delete an assignment
      description: Delete an assignment and all associated submissions. Teacher only.
      operationId: deleteAssignment
      parameters:
        - $ref: "#/components/parameters/AssignmentId"
      responses:
        "200":
          description: Assignment deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse_Null"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  # =========================================================================
  # SUBMISSION ENDPOINTS (Gateway → Core)
  # =========================================================================

  /assignments/{assignmentId}/submissions:
    get:
      tags: [Submissions]
      summary: List submissions for an assignment
      description: |
        - **Students** see only their own submissions.
        - **Teachers** see all submissions for the assignment.
      operationId: listAssignmentSubmissions
      parameters:
        - $ref: "#/components/parameters/AssignmentId"
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/LimitParam"
        - name: status
          in: query
          description: Filter by submission status
          schema:
            type: string
            enum: [pending, submitted, graded, late, returned]
      responses:
        "200":
          description: Submissions retrieved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse_PaginatedSubmissions"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

    post:
      tags: [Submissions]
      summary: Create a submission
      description: |
        Submit code for an assignment. Students only.
        If `requireGithubRepo` is set on the assignment, `githubRepoUrl` is required.
        After creation, the submission status is `submitted`.
        If the assignment has `requireGithubRepo`, analysis is triggered automatically.
      operationId: createSubmission
      parameters:
        - $ref: "#/components/parameters/AssignmentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSubmissionRequest"
      responses:
        "201":
          description: Submission created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse_SubmissionResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /submissions/{submissionId}:
    get:
      tags: [Submissions]
      summary: Get submission by ID
      description: Retrieve a specific submission with its analysis status if available.
      operationId: getSubmissionById
      parameters:
        - $ref: "#/components/parameters/SubmissionId"
      responses:
        "200":
          description: Submission retrieved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse_SubmissionDetailResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  # =========================================================================
  # ANALYSIS ENDPOINTS (Gateway → Core → Code Analyzer)
  # =========================================================================

  /submissions/{submissionId}/analyze:
    post:
      tags: [Analysis]
      summary: Trigger code analysis for a submission
      description: |
        Manually trigger code analysis for a submission.
        The Gateway forwards this to the Core service, which calls the Code Analyzer.
        The analysis runs asynchronously; poll `/submissions/{id}` or `/submissions/{id}/analysis`
        to check the status.

        **Flow:** Gateway → Core → Code Analyzer → (async) Notifications
      operationId: triggerAnalysis
      parameters:
        - $ref: "#/components/parameters/SubmissionId"
      responses:
        "202":
          description: Analysis triggered (processing asynchronously)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse_AnalysisTriggerResponse"
              example:
                success: true
                data:
                  submissionId: 1
                  analysisId: 42
                  status: analyzing
                  message: "Analysis has been queued"
                message: Analysis triggered successfully
                timestamp: "2026-02-03T13:00:00Z"
        "400":
          description: Submission has no GitHub repo URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /submissions/{submissionId}/analysis:
    get:
      tags: [Analysis]
      summary: Get analysis results for a submission
      description: Retrieve the code analysis results and report for a submission.
      operationId: getAnalysisResults
      parameters:
        - $ref: "#/components/parameters/SubmissionId"
      responses:
        "200":
          description: Analysis results retrieved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse_AnalysisResultResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  # =========================================================================
  # GRADE ENDPOINTS (Gateway → Core)
  # =========================================================================

  /submissions/{submissionId}/grade:
    post:
      tags: [Grades]
      summary: Grade a submission
      description: Assign a grade and feedback to a submission. Teacher only.
      operationId: gradeSubmission
      parameters:
        - $ref: "#/components/parameters/SubmissionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateGradeRequest"
      responses:
        "201":
          description: Grade assigned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse_GradeResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Submission already graded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    get:
      tags: [Grades]
      summary: Get grade for a submission
      description: Retrieve the grade and feedback for a submission.
      operationId: getGrade
      parameters:
        - $ref: "#/components/parameters/SubmissionId"
      responses:
        "200":
          description: Grade retrieved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse_GradeResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

    put:
      tags: [Grades]
      summary: Update a grade
      description: Update an existing grade. Teacher only.
      operationId: updateGrade
      parameters:
        - $ref: "#/components/parameters/SubmissionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateGradeRequest"
      responses:
        "200":
          description: Grade updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse_GradeResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  # =========================================================================
  # ANNOUNCEMENT ENDPOINTS (Gateway → Core)
  # =========================================================================

  /courses/{courseId}/announcements:
    get:
      tags: [Announcements]
      summary: List announcements for a course
      description: Retrieve all announcements in a course. Must be enrolled or teacher.
      operationId: listCourseAnnouncements
      parameters:
        - $ref: "#/components/parameters/CourseId"
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/LimitParam"
      responses:
        "200":
          description: Announcements retrieved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse_PaginatedAnnouncements"
        "401":
